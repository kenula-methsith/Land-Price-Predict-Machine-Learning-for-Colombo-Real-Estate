<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colombo Land Price Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center">land price predictor in Colombo district</h1>
        <form id="predict-form" class="space-y-4">
            <div>
                <label for="land_type" class="block text-sm font-medium text-gray-700">Land Type</label>
                <select id="land_type" name="land_type" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    {% for type in land_types %}
                        <option value="{{ type }}">{{ type }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="land_size" class="block text-sm font-medium text-gray-700">Land Size (Perches)</label>
                <input type="number" id="land_size" name="land_size" step="0.01" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <div>
                <label for="address" class="block text-sm font-medium text-gray-700">Address</label>
                <select id="address" name="address" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    {% for addr in addresses %}
                        <option value="{{ addr }}">{{ addr }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Predict Price</button>
        </form>
        <div id="result" class="mt-6 text-center"></div>
    </div>
    <script>
        document.getElementById('predict-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const response = await fetch('/predict', {
                method: 'POST',
                body: formData
            });
            const result = await response.json();
            const resultDiv = document.getElementById('result');
            if (result.error) {
                resultDiv.innerHTML = `<p class="text-red-500">${result.error}</p>`;
            } else {
                let featureHTML = '';
                for (const [key, value] of Object.entries(result.derived_features)) {
                    featureHTML += `<p class="text-sm text-gray-600">${key}: ${value}</p>`;
                }
                resultDiv.innerHTML = `
                    <p class="text-green-500 text-lg font-semibold mb-2">Predicted Price: LKR ${result.prediction}</p>
                    <div class="bg-gray-50 border rounded p-3">${featureHTML}</div>
                `;
            }
        });
    </script>
    
</body>
</html>5
